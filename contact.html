<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Editkaro.in</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { font-family: Arial, sans-serif; background-color: #f5f5f5; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; }
    form { display: flex; flex-direction: column; gap: 15px; }
    input, textarea { padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; width: 100%; }
    button { padding: 12px; border: none; background-color: #ff4d4d; color: #fff; font-size: 16px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
    button:hover { background-color: #e60000; }
    #formMessage { text-align: center; margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Contact Us</h1>
     <form name="contact" method="POST" data-netlify="true">
  <input type="hidden" name="form-name" value="contact">
  <p><label>Name: <input type="text" name="name" required></label></p>
  <p><label>Email: <input type="email" name="email" required></label></p>
  <p><label>Message: <textarea name="message" required></textarea></label></p>
  <p><button type="submit">Send</button></p>
</form>
    <p id="formMessage"></p>
  </div>

</body>
</html>
