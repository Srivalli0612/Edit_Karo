<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio | Editkaro.in</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Editkaro.<span style="color: #fff;">in</span></h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="portfolio.html" style="color:#ff4d4d;">Portfolio</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="portfolio-section">
    <h2>Our <span>Portfolio</span></h2>
    <p>Explore our diverse works — from short reels to cinematic edits.</p>

    <div class="filter-buttons">
    <button class="filter-btn active" data-category="all">All</button>
    <button class="filter-btn" data-category="short">Short-form</button>
    <button class="filter-btn" data-category="long">Long-form</button>
    <button class="filter-btn" data-category="gaming">Gaming</button>
    <button class="filter-btn" data-category="football">Football</button>
    <button class="filter-btn" data-category="color">Color Grading</button>
    <button class="filter-btn" data-category="anime">Anime</button>
    <button class="filter-btn" data-category="ads">E-commerce Ads</button>
  </div>

    <div class="video-gallery">
    <div class="video-card" data-category="short">
      <video src="videos/short form video.mp4" muted loop></video>
      <div class="overlay"><h3>Short Form Edit</h3></div>
    </div>

    <div class="video-gallery">
    <div class="video-card" data-category="long">
      <video src="videos/long form video.mp4" muted loop></video>
      <div class="overlay"><h3>Long Form Edit</h3></div>
    </div>

    <div class="video-card" data-category="gaming">
      <video src="videos/gaming.mp4" muted loop></video>
      <div class="overlay"><h3>Gaming Montage</h3></div>
    </div>

    <div class="video-card" data-category="color">
      <video src="videos/color.mp4" muted loop></video>
      <div class="overlay"><h3>Color Grading Demo</h3></div>
    </div>

    <div class="video-card" data-category="football">
      <video src="videos/football.mp4" muted loop></video>
      <div class="overlay"><h3>Football Edit</h3></div>
    </div>

    <div class="video-card" data-category="anime">
      <video src="videos/animation.mp4" muted loop></video>
      <div class="overlay"><h3>Anime Video Edit</h3></div>
    </div>

    <div class="video-card" data-category="ads">
      <video src="videos/E-commerce ad.mp4" muted loop></video>
      <div class="overlay"><h3>E-commerce Ad</h3></div>
    </div>
  </div>
  </section>

  <footer>
    <p>© 2025 Editkaro.in | All Rights Reserved</p>
  </footer>
<script>
    document.addEventListener("DOMContentLoaded", () => {
  const filterButtons = document.querySelectorAll(".filter-btn");
  const videoCards = document.querySelectorAll(".video-card");

  // Filter Functionality
  filterButtons.forEach(button => {
    button.addEventListener("click", () => {
      filterButtons.forEach(btn => btn.classList.remove("active"));
      button.classList.add("active");

      const category = button.getAttribute("data-category");
      videoCards.forEach(card => {
        if (category === "all" || card.getAttribute("data-category") === category) {
          card.style.display = "block";
        } else {
          card.style.display = "none";
        }
      });
    });
  });

  // Video Popup Functionality
  const popup = document.createElement("div");
  popup.classList.add("video-popup");
  popup.innerHTML = `
    <div class="video-popup-content">
      <span class="close-popup">&times;</span>
      <video controls autoplay></video>
    </div>
  `;
  document.body.appendChild(popup);

  const popupVideo = popup.querySelector("video");
  const closePopup = popup.querySelector(".close-popup");

  videoCards.forEach(card => {
    const video = card.querySelector("video");
    card.addEventListener("click", () => {
      popupVideo.src = video.getAttribute("src");
      popup.classList.add("active");
    });
  });

  closePopup.addEventListener("click", () => {
    popup.classList.remove("active");
    popupVideo.pause();
    popupVideo.src = "";
  });
});

  </script>
</body>
</html>
